name: mods

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # MineGTA: the GTA-in-Minecraft Fabric mod (MC 26.3, Java 25)
  minegta:
    name: MineGTA Fabric mod
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minegta-mod
          path: build/libs/*.jar
          if-no-files-found: error

  # Passthrough: the Minecraft mod that hands its frames to a host game and takes its camera
  # (this is what MCOnly.asi talks to)
  passthrough:
    name: Passthrough Fabric mod
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: build
        run: ./gradlew build
        working-directory: mc

      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: passthrough-mod
          path: mc/build/libs/*.jar
          if-no-files-found: error
